name: Publish documentation

on:
  repository_dispatch:
    types: [publish-docs]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Tag or SHA from hardwood to build (e.g. v0.2.0)'
        required: true
      version:
        description: 'Version label without v prefix (e.g. 0.2.0, or dev)'
        required: true
      update_latest:
        description: 'Update the latest alias to point to this version'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SOURCE_REF: >-
        ${{ github.event_name == 'repository_dispatch'
            && github.event.client_payload.source_ref
            || inputs.source_ref }}
      VERSION: >-
        ${{ github.event_name == 'repository_dispatch'
            && github.event.client_payload.version
            || inputs.version }}
      UPDATE_LATEST: >-
        ${{ github.event_name == 'repository_dispatch'
            && github.event.client_payload.update_latest
            || inputs.update_latest }}

    steps:
      - name: Checkout site repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0        # mike needs gh-pages history

      - name: Checkout hardwood source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          repository: hardwood-hq/hardwood
          ref: ${{ env.SOURCE_REF }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.x'

      - name: Install MkDocs dependencies
        run: pip install -r source/docs/requirements.txt

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build JavaDoc
        working-directory: source
        run: ./mvnw javadoc:aggregate '-Dmaven.javadoc.skippedModules=hardwood-(?!core|s3|avro|aws-auth).*'

      - name: Deploy docs
        run: |
          sed -i "s|/api/latest/|/api/$VERSION/|" source/docs/mkdocs.yml
          find source/docs/content -name '*.md' -exec sed -i "s|/api/latest/|/api/$VERSION/|" {} +

          if [ "$VERSION" = "dev" ]; then
            mike deploy \
              --config-file source/docs/mkdocs.yml \
              --branch gh-pages \
              dev
          elif [ "$UPDATE_LATEST" = "true" ]; then
            mike deploy \
              --config-file source/docs/mkdocs.yml \
              --branch gh-pages \
              --update-aliases \
              $VERSION latest

            mike set-default \
              --config-file source/docs/mkdocs.yml \
              --branch gh-pages \
              latest
          else
            mike deploy \
              --config-file source/docs/mkdocs.yml \
              --branch gh-pages \
              $VERSION
          fi

          git checkout gh-pages

          bash source/docs/patch-seo.sh "https://hardwood-hq.github.io"

          mkdir -p api/$VERSION
          cp -r source/target/reports/apidocs/. api/$VERSION/
          if [ "$UPDATE_LATEST" = "true" ] && [ "$VERSION" != "dev" ]; then
            rm -rf api/latest
            cp -r source/target/reports/apidocs/. api/latest/
          fi

          git add api/
          git add -u
          git commit --amend --no-edit
          git push origin gh-pages
